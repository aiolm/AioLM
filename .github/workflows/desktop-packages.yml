name: Validate v0.3.2 Windows release installers

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  install:
    name: Install exact v0.3.2 Windows release artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the release validation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: e439b52038142439c8c85b112d2949687fa273f2
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Download the completed Windows release build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $run = gh api repos/aiolm/AioLM/actions/runs/40496431689 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the release run" }
          if ($run.head_sha -ne "e439b52038142439c8c85b112d2949687fa273f2" -or $run.path -ne ".github/workflows/release.yml") { throw "Release source mismatch" }
          $jobs = gh api repos/aiolm/AioLM/actions/runs/40496431689/jobs | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read release build jobs" }
          $build = @($jobs.jobs | Where-Object { $_.id -eq 122163002953 })
          if ($build.Count -ne 1 -or $build[0].conclusion -ne "success") { throw "Windows release build did not pass" }
          $artifacts = gh api repos/aiolm/AioLM/actions/runs/40496431689/artifacts | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Unable to read release artifacts" }
          $artifact = @($artifacts.artifacts | Where-Object { $_.id -eq 12733595133 -and $_.name -eq "windows-release-assets" })
          if ($artifact.Count -ne 1 -or $artifact[0].expired) { throw "Windows release artifact is unavailable" }
          if ($artifact[0].digest -ne "sha256:a49bb40f69f62eba013952ab3193d5c951692f9295431561e103edd25ac915cc") { throw "Release artifact digest mismatch" }
          gh run download 40496431689 --repo aiolm/AioLM --name windows-release-assets --dir tmp/release-assets
          if ($LASTEXITCODE -ne 0) { throw "Release artifact download failed" }
          New-Item -ItemType Directory -Force .codex-target/release/bundle/nsis, .codex-target/release/bundle/msi | Out-Null
          Move-Item tmp/release-assets/AioLM_0.3.2_x64-setup.exe .codex-target/release/bundle/nsis/
          Move-Item tmp/release-assets/AioLM_0.3.2_x64_en-US.msi .codex-target/release/bundle/msi/
          Get-ChildItem .codex-target/release/bundle -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-List
      - name: Install, reinstall, repair and remove NSIS and MSI
        run: node scripts/smoke-installers.mjs
