name: Desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version and release state
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { resolveReleaseVersion } = await import(`${require('node:url').pathToFileURL(process.cwd() + '/scripts/release-policy.mjs')}`);
            await resolveReleaseVersion({ github, context, core });
      - name: Retain exact-source publication policy
        if: steps.resolve.outputs.should_release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-policy
          path: scripts/release-policy.mjs
          if-no-files-found: error

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Build Windows installers
    runs-on: windows-latest
    # Backstop against a hung verification step or NSIS/MSI packaging;
    # normal runs finish well within this.
    timeout-minutes: 60
    # Build and test with read-only access; publication is isolated below.
    permissions:
      contents: read
    # The benchmark service origin is compiled into the native binary, so it
    # must be present for every cargo invocation in this job. An unset or
    # blank repository variable uses the built-in official website, exactly
    # like a developer build; `off` explicitly disables anonymous publishing;
    # any other value that is not a usable release origin fails `cargo test`
    # below instead of shipping installers whose publishing is silently off.
    env:
      AIOLM_BENCHMARK_API_URL: ${{ vars.AIOLM_BENCHMARK_API_URL }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Isolate the pinned hosted Rust toolchain
        run: node scripts/ci-rust-toolchain.mjs
      - name: Record package build inputs
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: node scripts/release-ci.mjs record-inputs --sha "$TARGET_SHA" --output tmp/build-inputs.json
      - name: Retain package input fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-inputs-${{ runner.os }}-${{ runner.arch }}
          path: tmp/build-inputs.json
          if-no-files-found: error
      - name: Restore release Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "src-tauri -> ../.codex-target"
          shared-key: "package-${{ runner.os }}-${{ runner.arch }}"
          env-vars: "AIOLM_BENCHMARK_API_URL CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL CFLAGS CXXFLAGS"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report benchmark sharing configuration
        shell: pwsh
        run: |
          $override = "$env:AIOLM_BENCHMARK_API_URL".Trim()
          if ($override -eq "") {
            Write-Host "AIOLM_BENCHMARK_API_URL is not set; anonymous benchmark publishing targets the built-in official website https://aiolm.vercel.app"
          } elseif ($override -eq "off") {
            Write-Warning "AIOLM_BENCHMARK_API_URL is 'off'; these installers ship with anonymous benchmark publishing disabled."
          } else {
            Write-Host "A benchmark API origin override is configured; CI fingerprints verify the exact build input before publication."
          }
      # CI verifies this same main commit and build origin in parallel. Tauri
      # compiles both release binaries once with the same production context.
      - name: Build NSIS and MSI
        run: node scripts/package-tauri.mjs
      - name: Verify NSIS and MSI installation and installed CLI
        timeout-minutes: 15
        run: node scripts/smoke-installers.mjs
      - name: Retain release compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: .codex-target/cargo-timings
      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $files = @(Get-ChildItem -Path ".codex-target/release/bundle" -Recurse -File | Where-Object {
            $_.Name -like "AioLM_*_x64-setup.exe" -or $_.Name -like "AioLM_*_x64_en-US.msi"
          })
          if ($files.Count -ne 2) { throw "Expected exactly one NSIS and one MSI installer asset, found $($files.Count)" }
          foreach ($file in $files) { Copy-Item $file.FullName (Join-Path $assetDir $file.Name) -Force }
          Copy-Item "install.ps1" (Join-Path $assetDir "install.ps1") -Force
      - name: Validate release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedNames = @(
            ("AioLM_{0}_x64-setup.exe" -f $env:RELEASE_VERSION),
            ("AioLM_{0}_x64_en-US.msi" -f $env:RELEASE_VERSION),
            "install.ps1"
          )
          $assets = @(Get-ChildItem -LiteralPath "release-assets" -File)
          if ($assets.Count -ne $expectedNames.Count) {
            throw "Expected exactly one NSIS installer, one MSI installer, and install.ps1."
          }
          foreach ($expectedName in $expectedNames) {
            $asset = @($assets | Where-Object { $_.Name -eq $expectedName })
            if ($asset.Count -ne 1 -or $asset[0].Length -eq 0) {
              throw "Release asset $expectedName is missing or empty."
            }
          }
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-assets
          path: release-assets
          compression-level: 0
          if-no-files-found: error

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Build Linux installers
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      AIOLM_BENCHMARK_API_URL: ${{ vars.AIOLM_BENCHMARK_API_URL }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Setup pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils bubblewrap
      - name: Enable unprivileged user namespaces for the AppImage runtime build
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces; bwrap needs one
          # to build the pinned AppImage runtime without root.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Isolate the pinned hosted Rust toolchain
        run: node scripts/ci-rust-toolchain.mjs
      - name: Record package build inputs
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: node scripts/release-ci.mjs record-inputs --sha "$TARGET_SHA" --output tmp/build-inputs.json
      - name: Retain package input fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-inputs-${{ runner.os }}-${{ runner.arch }}
          path: tmp/build-inputs.json
          if-no-files-found: error
      - name: Restore release Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "src-tauri -> ../.codex-target"
          shared-key: "package-${{ runner.os }}-${{ runner.arch }}"
          env-vars: "AIOLM_BENCHMARK_API_URL CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL CFLAGS CXXFLAGS"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Restore pinned AppImage runtime
        if: runner.os == 'Linux'
        id: appimage-runtime
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .codex-target/appimage-runtime
          key: appimage-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/appimage-runtime/**') }}
      - name: Prepare and verify pinned AppImage runtime early
        if: runner.os == 'Linux'
        run: node scripts/package-tauri.mjs --prepare-runtime
      - name: Save verified AppImage runtime
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.appimage-runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .codex-target/appimage-runtime
          key: appimage-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/appimage-runtime/**') }}
      - name: Build DEB and AppImage
        run: npm run package:tauri
      - name: Verify installation, launcher and icon
        run: node scripts/smoke-installers.mjs
      - name: Retain release compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: .codex-target/cargo-timings
      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir release-assets
          cp ".codex-target/release/bundle/deb/AioLM_${RELEASE_VERSION}_amd64.deb" release-assets/
          cp ".codex-target/release/bundle/appimage/AioLM_${RELEASE_VERSION}_amd64.AppImage" release-assets/
          cp scripts/register-linux-desktop.py release-assets/
          test "$(find release-assets -type f -size +0c | wc -l)" -eq 3
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-assets
          path: release-assets
          compression-level: 0
          if-no-files-found: error

  build-macos:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Build macOS DMG (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, arch: aarch64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      AIOLM_BENCHMARK_API_URL: ${{ vars.AIOLM_BENCHMARK_API_URL }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Setup pinned npm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Isolate the pinned hosted Rust toolchain
        run: node scripts/ci-rust-toolchain.mjs
      - name: Record package build inputs
        shell: bash
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: node scripts/release-ci.mjs record-inputs --sha "$TARGET_SHA" --output tmp/build-inputs.json
      - name: Retain package input fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-inputs-${{ runner.os }}-${{ runner.arch }}
          path: tmp/build-inputs.json
          if-no-files-found: error
      - name: Restore release Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: "src-tauri -> ../.codex-target"
          shared-key: "package-${{ runner.os }}-${{ runner.arch }}"
          env-vars: "AIOLM_BENCHMARK_API_URL CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL CFLAGS CXXFLAGS"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      # Ad-hoc signed (no Developer ID); the package check requires a strict signature.
      - name: Build APP and DMG
        run: npm run package:tauri
      - name: Verify installation, launch, quit and install.sh
        timeout-minutes: 15
        run: node scripts/smoke-installers.mjs
      - name: Retain release compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-timings-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          retention-days: 14
          path: .codex-target/cargo-timings
      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release-assets
          cp ".codex-target/release/bundle/dmg/AioLM_${RELEASE_VERSION}_${ARCH}.dmg" release-assets/
          if [ "$ARCH" = aarch64 ]; then cp install.sh release-assets/; fi
          test "$(find release-assets -type f -size +0c | wc -l | tr -d ' ')" -eq "$([ "$ARCH" = aarch64 ] && echo 2 || echo 1)"
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-release-assets
          path: release-assets
          compression-level: 0
          if-no-files-found: error

  verify-ci:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    name: Require CI for the exact main commit
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.ci.outputs.run_id }}
      url: ${{ steps.ci.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Wait for existing main CI without starting another run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: node scripts/release-ci.mjs wait --sha "$TARGET_SHA" --output "$RUNNER_TEMP/main-ci.json"

  ready:
    needs: [prepare, build, build-linux, build-macos, verify-ci]
    if: needs.prepare.outputs.should_release == 'true'
    name: Prepare verified assets and approval summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Download all four verified platform outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: "*-release-assets"
          merge-multiple: true
          path: release-assets
      - name: Download native CI input fingerprints
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-inputs-*
          path: ci-build-inputs
          run-id: ${{ needs.verify-ci.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download package input fingerprints
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-inputs-*
          path: package-build-inputs
      - name: Verify payload inventory and prepare LF checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          CI_RUN_ID: ${{ needs.verify-ci.outputs.run_id }}
        run: node scripts/release-ci.mjs prepare-assets --directory release-assets --version "$RELEASE_VERSION" --sha "$TARGET_SHA" --ci-run-id "$CI_RUN_ID" --ci-inputs ci-build-inputs --package-inputs package-build-inputs
      - name: Retain the exact ten files for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-installers
          path: release-assets
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [prepare, ready, verify-ci]
    if: needs.prepare.outputs.should_release == 'true'
    name: Publish installers and release
    runs-on: windows-latest
    # Publish the artifacts already verified by the build job.
    timeout-minutes: 20
    environment: release-publish
    # Only this job can publish; it loads only the exact-source policy artifact,
    # not a repository checkout or package build scripts.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download exact-source publication policy
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-policy
          path: release-policy
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-installers
          path: release-assets
      - name: Recheck CI after approval
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          CI_RUN_ID: ${{ needs.verify-ci.outputs.run_id }}
        with:
          script: |
            const { recheckCI } = await import(`${require('node:url').pathToFileURL(process.cwd() + '/release-policy/release-policy.mjs')}`);
            await recheckCI({ github, context, env: process.env });
      - name: Recheck staged checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem release-assets -File)
          if ($files.Count -ne 10) { throw "Expected exactly ten staged release assets" }
          $raw = [IO.File]::ReadAllText((Join-Path $pwd "release-assets/checksums.txt"))
          if ($raw.Contains("`r") -or -not $raw.EndsWith("`n")) { throw "Noncanonical checksums" }
          $seen = @{}
          foreach ($line in ($raw.TrimEnd("`n") -split "`n")) {
            if ($line -notmatch '^([a-f0-9]{64})  ([A-Za-z0-9_.-]+)$') { throw "Invalid checksum record" }
            $digest = $Matches[1]
            $name = $Matches[2]
            if ($name -eq "checksums.txt" -or $seen.ContainsKey($name)) { throw "Duplicate checksum record" }
            $seen[$name] = $true
            $actual = (Get-FileHash -LiteralPath (Join-Path "release-assets" $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $digest) { throw "Staged asset changed: $name" }
          }
          if ($seen.Count -ne 9) { throw "Expected nine checked payloads" }
      - name: Recheck release and tag state after approval
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        with:
          script: |
            const { recheckReleaseState } = await import(`${require('node:url').pathToFileURL(process.cwd() + '/release-policy/release-policy.mjs')}`);
            await recheckReleaseState({ github, context, core, env: process.env });
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: AioLM ${{ needs.prepare.outputs.tag_name }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          body: |
            ## Packages and verification

            Windows x64: NSIS / MSI. Linux x86_64 (Ubuntu 24.04+): DEB / AppImage.
            macOS 13.3+: Apple silicon (aarch64) and Intel (x64) DMG, or install.sh.
            Assets are unsigned. Verify SHA-256 values against checksums.txt from this release.
            The macOS app is ad-hoc signed, not notarized: after opening a browser-downloaded copy,
            allow it once under System Settings > Privacy & Security > Open Anyway, or install with
            install.sh, which verifies the DMG's SHA-256.
            DEB registers the launcher and icon automatically. For AppImage desktop integration,
            use register-linux-desktop.py from this release after verifying its checksum.
            Installation guide: https://github.com/aiolm/AioLM/blob/${{ needs.prepare.outputs.tag_name }}/docs/guides/install.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: release-assets/*

  verify-public:
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_release == 'true'
    name: Verify publicly downloaded release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install Linux runtime dependencies for the isolated CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3
      - name: Verify stable latest release, public payloads and clean-home CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: python3 -B scripts/verify-public-release.py --version "$RELEASE_VERSION" --expected-sha "$TARGET_SHA" --output-dir "$RUNNER_TEMP/public-release-verification" --execute-cli
      - name: Record public verification summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/public-release-verification/summary.md" ]; then
            cat "$RUNNER_TEMP/public-release-verification/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-release-verification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/public-release-verification/verification-report.json
            ${{ runner.temp }}/public-release-verification/summary.md
