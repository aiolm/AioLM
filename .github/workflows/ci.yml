name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-checks:
    name: Frontend checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Lint and dependency audit
        shell: bash
        run: |
          npm run lint
          npm audit --omit=dev --audit-level=high
      - name: Contracts, tooling and direct tests
        run: npm run test:checks
      - name: Linux registration and Python tooling
        if: runner.os == 'Linux'
        run: |
          bash -n install.sh
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/model-repair -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/provider-compatibility -p 'test_*.py'
          python3 -B src-tauri/src/providers/vllm_probe_tests.py
          python3 -B src-tauri/src/providers/vllm_speech_capabilities_tests.py
          python3 -B src-tauri/src/providers/metal_capabilities_tests.py
          python3 -B -m unittest discover -s src-tauri/src/providers/tests -p 'test_*.py'
      - name: Typecheck and frontend build
        shell: bash
        run: |
          npm run typecheck
          npm run build
      - name: Restore measured frontend durations
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tmp/frontend-ci-history/timings.json
          key: frontend-times-v1-${{ matrix.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: frontend-times-v1-${{ matrix.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}-
      - name: Plan complete frontend test coverage
        run: node scripts/frontend-ci.mjs plan --shards 2 --timings tmp/frontend-ci-history/timings.json --output tmp/frontend-ci/plan.json
      - name: Retain test plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-plan-${{ matrix.os }}
          path: tmp/frontend-ci/plan.json
          if-no-files-found: error

  frontend-shards:
    needs: frontend-checks
    name: Frontend tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Build contracts
        run: npm run build:contracts
      - name: Download exact test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-plan-${{ matrix.os }}
          path: tmp/frontend-ci
      - name: Execute assigned tests with coverage
        run: node scripts/frontend-ci.mjs shard --plan tmp/frontend-ci/plan.json --index ${{ matrix.shard }} --output tmp/frontend-ci/shard-${{ matrix.shard }}
      - name: Retain shard results even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-shard-${{ matrix.os }}-${{ matrix.shard }}
          path: tmp/frontend-ci/shard-${{ matrix.shard }}
          if-no-files-found: error

  frontend-merge:
    needs: [frontend-checks, frontend-shards]
    name: Frontend global coverage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Build contracts
        run: npm run build:contracts
      - name: Download exact test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: frontend-plan-${{ matrix.os }}
          path: tmp/frontend-ci
      - name: Download all OS shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: frontend-shard-${{ matrix.os }}-*
          path: tmp/frontend-ci/shards
      - name: Verify complete test inventory and original global thresholds
        run: node scripts/frontend-ci.mjs merge --plan tmp/frontend-ci/plan.json --input tmp/frontend-ci/shards
      - name: Prepare duration history for future plans
        run: node -e "const fs=require('node:fs'); fs.mkdirSync('tmp/frontend-ci-history',{recursive:true}); fs.copyFileSync('tmp/frontend-ci/merged/timings.json','tmp/frontend-ci-history/timings.json');"
      - name: Save successful main duration history
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: tmp/frontend-ci-history/timings.json
          key: frontend-times-v1-${{ matrix.os }}-${{ hashFiles('.node-version', 'package-lock.json') }}-${{ github.sha }}
      - name: Retain coverage and measured file timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-coverage-${{ matrix.os }}
          if-no-files-found: error
          path: |
            coverage/coverage-summary.json
            tmp/frontend-ci/merged

  frontend:
    name: Frontend tests and build
    if: always()
    needs: [frontend-checks, frontend-shards, frontend-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every OS, shard and merged coverage result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(results)) { if (job.result !== "success") throw new Error(name + ": " + job.result); }'

  rust:
    name: Rust checks
    runs-on: windows-latest
    # Backstop against a hung compiler/linker or Rust test; normal runs
    # finish well within this on windows-latest.
    timeout-minutes: 60
    env:
      AIOLM_BENCHMARK_API_URL: ${{ vars.AIOLM_BENCHMARK_API_URL }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Record native verification inputs
        run: node scripts/release-ci.mjs record-inputs --sha "${{ github.sha }}" --output tmp/build-inputs.json
      - name: Restore Cargo dependencies (verify)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, reviewed commit
        with:
          workspaces: "src-tauri -> ../.codex-target"
          shared-key: "verify-${{ runner.os }}-${{ runner.arch }}"
          env-vars: "AIOLM_BENCHMARK_API_URL CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL CFLAGS CXXFLAGS"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Retain native verification input fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-inputs-${{ runner.os }}-${{ runner.arch }}
          path: tmp/build-inputs.json
          if-no-files-found: error
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Rust tests
        env:
          AIOLM_CLI_FIXTURE_EVIDENCE: ${{ runner.temp }}/headless-cli-evidence/all-features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features --timings
      - name: Default-feature native tests
        env:
          AIOLM_CLI_FIXTURE_EVIDENCE: ${{ runner.temp }}/headless-cli-evidence/default
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --timings
      - name: Frontend build for Tauri metadata validation
        run: npm run build
      - name: Build desktop and CLI
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bins
      - name: Native CLI with a clean home
        run: npm run test:native-cli

      - name: Retain Windows process evidence and Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-evidence-windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/headless-cli-evidence
            .codex-target/cargo-timings
      - name: Fetch public runtime metadata without the shared anonymous API limit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/ggml-org/llama.cpp/releases?per_page=10' > "$RUNNER_TEMP/aiolm-release-catalog.json"
      - name: Real CPU runtime and model lifecycle
        timeout-minutes: 15
        env:
          AIOLM_NATIVE_CPU: "1"
          AIOLM_NATIVE_RELEASES: ${{ runner.temp }}/aiolm-release-catalog.json
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test native_cpu real_cpu_cli_lifecycle -- --ignored --exact --nocapture --test-threads=1
      - name: Windows Credential Manager roundtrip
        if: success() || failure()
        env:
          AIOLM_VAULT_SMOKE: roundtrip
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib benchmark::sharing::vault::tests::real_vault_roundtrip -- --ignored --exact --test-threads=1

  rust-portability:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      AIOLM_BENCHMARK_API_URL: ${{ vars.AIOLM_BENCHMARK_API_URL }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    # Execute native tests on each architecture, including Unix process-tree
    # cleanup and RSS sampling. GPU/model and desktop integration are separate.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: npm
      - name: Setup pinned npm
        shell: bash
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild esbuild
        run: npm rebuild esbuild
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev gnome-keyring xvfb xauth dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - name: Record native verification inputs
        run: node scripts/release-ci.mjs record-inputs --sha "${{ github.sha }}" --output tmp/build-inputs.json
      - name: Restore Cargo dependencies (verify)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2, reviewed commit
        with:
          workspaces: "src-tauri -> ../.codex-target"
          shared-key: "verify-${{ runner.os }}-${{ runner.arch }}"
          env-vars: "AIOLM_BENCHMARK_API_URL CARGO_PROFILE_DEV_DEBUG CARGO_PROFILE_TEST_DEBUG CARGO_INCREMENTAL CFLAGS CXXFLAGS"
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Retain native verification input fingerprint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-inputs-${{ runner.os }}-${{ runner.arch }}
          path: tmp/build-inputs.json
          if-no-files-found: error
      - name: Lint native code
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Native tests
        env:
          AIOLM_CLI_FIXTURE_EVIDENCE: ${{ runner.temp }}/headless-cli-evidence/all-features
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features --timings
      - name: Default-feature native tests
        env:
          AIOLM_CLI_FIXTURE_EVIDENCE: ${{ runner.temp }}/headless-cli-evidence/default
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --timings
      - name: Secret Service lock and native authentication cancellation
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: python3 scripts/smoke-linux-vault.py
      - name: Build frontend
        run: npm run build
      - name: Build desktop and CLI
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --bins
      - name: Native CLI with a clean home
        run: npm run test:native-cli
      - name: Detected macOS GPU and Metal support
        if: runner.os == 'macOS'
        run: |
          home="$(mktemp -d)"
          HOME="$home" AIOLM_HOME="$home/aiolm" .codex-target/debug/aiolm-cli runtime device > "$RUNNER_TEMP/aiolm-device.json"
          cat "$RUNNER_TEMP/aiolm-device.json"
          # Metal is recommended on Apple silicon and never on Intel Macs.
          node -e 'const device = require(process.argv[1]); if (device.profile.gpus.length === 0) throw new Error("no GPU was detected"); const metal = device.backends.find(item => item.backend === "metal"); const expected = process.arch === "arm64" ? "recommended" : "unsupported"; if (metal?.fit !== expected) throw new Error("Metal should be " + expected + ": " + JSON.stringify(metal));' "$RUNNER_TEMP/aiolm-device.json"
      - name: Fetch public runtime metadata without the shared anonymous API limit
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api 'repos/ggml-org/llama.cpp/releases?per_page=10' > "$RUNNER_TEMP/aiolm-release-catalog.json"
      - name: Real macOS CPU model lifecycle
        id: macos_cpu
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          AIOLM_NATIVE_CPU: "1"
          AIOLM_NATIVE_RELEASES: ${{ runner.temp }}/aiolm-release-catalog.json
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test native_cpu real_cpu_cli_lifecycle -- --ignored --exact --nocapture --test-threads=1
      - name: Build macOS debug app with embedded WebDriver
        if: runner.os == 'macOS'
        env:
          TAURI_CONFIG: '{"build":{"devUrl":null}}'
        run: |
          mkdir -p tmp
          swiftc scripts/macos-window-probe.swift -o tmp/macos-window-probe
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin aiolm --no-default-features --features macos-ui-smoke
      - name: Real WKWebView onboarding, settings and window lifecycle
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: node scripts/smoke-macos-ui.mjs
      - name: Real LaunchServices launch, reopen, command lookup and quit
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          swiftc scripts/macos-terminate-app.swift -o tmp/macos-terminate-app
          node scripts/smoke-macos-launch.mjs
      - name: Retain synthetic macOS UI evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-ui-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: tmp/macos-ui.png
      - name: Probe hosted Metal device availability
        if: (success() || failure()) && runner.os == 'macOS'
        id: metal
        run: swift scripts/macos-metal-probe.swift >> "$GITHUB_OUTPUT"
      - name: Real Metal model lifecycle when the runner exposes a GPU
        if: (success() || failure()) && runner.os == 'macOS' && matrix.os == 'macos-15' && steps.macos_cpu.outcome == 'success' && steps.metal.outputs.available == 'true'
        timeout-minutes: 20
        env:
          AIOLM_NATIVE_METAL: "1"
          AIOLM_NATIVE_RELEASES: ${{ runner.temp }}/aiolm-release-catalog.json
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test native_cpu real_metal_cli_lifecycle -- --ignored --exact --nocapture --test-threads=1
      - name: Retain native Cargo timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-timings-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: .codex-target/cargo-timings
