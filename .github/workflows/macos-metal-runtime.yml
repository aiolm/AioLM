name: Publish Intel Mac Metal runtime

# llama.cpp's x64 macOS release disables Metal. Build that runtime from the
# official release tag with AioLM's source builder, verify it on a separate
# Intel runner, and publish it only from main after the environment approval.
on:
  workflow_dispatch:
    inputs:
      build:
        description: "llama.cpp release tag, e.g. b11393 (empty: newest release)"
        required: false
        type: string
      publish:
        description: "Publish the verified bundle as a prerelease"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/macos-metal-runtime.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Metal runtime
    runs-on: macos-15-intel
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      build: ${{ steps.release.outputs.build }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Resolve the official release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.build }}
        run: |
          # Build tags are published as prereleases; "latest" names a semver release.
          build="${REQUESTED:-$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=30' --jq '[.[] | select(.tag_name | test("^b[0-9]+$"))][0].tag_name')}"
          [[ "$build" =~ ^b[0-9]{1,15}$ ]] || { echo "invalid release tag: $build"; exit 1; }
          commit="$(gh api "repos/ggml-org/llama.cpp/commits/$build" --jq .sha)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid commit for $build: $commit"; exit 1; }
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "llama.cpp $build at $commit"
      - name: Build from source and export the bundle
        env:
          BUILD: ${{ steps.release.outputs.build }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          export AIOLM_HOME="$RUNNER_TEMP/aiolm-home"
          name="aiolm-$BUILD-metal-macos-x64.zip"
          mkdir -p "$RUNNER_TEMP/bundle"
          tool() { cargo run --locked --manifest-path src-tauri/Cargo.toml --no-default-features --example runtime-bundle -- "$@"; }
          tool release metal "$BUILD" "$COMMIT"
          tool export metal "$BUILD" "$RUNNER_TEMP/bundle/$name"
          cd "$RUNNER_TEMP/bundle"
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: Retain the unpublished bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metal-runtime-macos-x64
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Install and run the bundle
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Download the bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metal-runtime-macos-x64
          path: bundle
      - name: Check the bundle checksum
        working-directory: bundle
        run: shasum -a 256 --check ./*.sha256
      - name: Probe the Metal device
        run: swift scripts/macos-metal-probe.swift
      - name: Bundle install, GPU verification and CLI lifecycle
        timeout-minutes: 30
        env:
          AIOLM_NATIVE_BUNDLE_BACKEND: metal
        run: |
          AIOLM_NATIVE_BUNDLE="$(ls "$PWD"/bundle/*.zip)" cargo test --locked --manifest-path src-tauri/Cargo.toml --test native_cpu real_bundle_cli_lifecycle -- --ignored --exact --nocapture --test-threads=1

  publish:
    name: Publish Metal runtime release
    needs: [build, verify]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pr-runtime-publish
    permissions:
      contents: write
    steps:
      - name: Download the verified bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metal-runtime-macos-x64
          path: release-assets
      - name: Publish the runtime release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: runtime-${{ needs.build.outputs.build }}-metal-macos-x64
          target_commitish: main
          name: llama.cpp ${{ needs.build.outputs.build }} Metal runtime for Intel Macs
          body: |
            AioLM-built Metal runtime for Intel Macs, from official llama.cpp release ${{ needs.build.outputs.build }} at commit ${{ needs.build.outputs.commit }}.
            Upstream's x64 macOS archive disables Metal. This bundle was built and verified by workflow run ${{ github.run_id }}; the ZIP embeds a file-level SHA-256 manifest.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.zip.sha256

  published:
    name: Install the published runtime from the catalog
    needs: [build, publish]
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: "1.98.0"
      - name: Fetch release metadata without the shared anonymous API limit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/aiolm-published.json"
      - name: Catalog install, GPU verification and CLI lifecycle
        timeout-minutes: 30
        env:
          AIOLM_NATIVE_METAL: "1"
          AIOLM_NATIVE_PUBLISHED: ${{ runner.temp }}/aiolm-published.json
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test native_cpu real_metal_cli_lifecycle -- --ignored --exact --nocapture --test-threads=1 | tee "$RUNNER_TEMP/published.log"
          grep -q "metal runtime installed: $BUILD (aiolm-$BUILD-metal-macos-x64.zip)" "$RUNNER_TEMP/published.log"
