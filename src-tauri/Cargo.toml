[package]
name = "aiolm"
version = "0.3.0"
default-run = "aiolm"
description = "AioLM: Tauri desktop GUI for llama.cpp"
authors = ["aiolm contributors"]
edition = "2021"
rust-version = "1.98.0"

[features]
# Normal cargo test runs the process/streaming smoke fixture without extra flags.
# Distribution scripts disable defaults so the fixture cannot be packaged.
default = ["test-fixtures"]
test-fixtures = []

[[bin]]
name = "fake-llama-server"
path = "src/bin/fake-llama-server.rs"
required-features = ["test-fixtures"]

[[test]]
name = "smoke_fake"
path = "tests/smoke_fake.rs"
required-features = ["test-fixtures"]

[lib]
name = "aiolm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "time", "macros", "rt-multi-thread", "io-util", "net", "sync"] }
futures-util = "0.3"
which = "6"
zip = "2"
flate2 = "1"
tar = "0.4"
pdf-extract = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
libc = "0.2"
keyring-core = "1"
arboard = "3"
open = "5"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
# Share the desktop plugins' async-io backend. Enabling zbus/tokio globally
# makes the notification plugin's blocking DBus call nest a Tokio runtime.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["signal"] }
