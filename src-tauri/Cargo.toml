[package]
name = "aiolm"
version = "0.1.14"
default-run = "aiolm"
description = "AioLM: Tauri desktop GUI for llama.cpp"
authors = ["aiolm contributors"]
edition = "2021"
rust-version = "1.98.0"

[lib]
name = "aiolm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "time", "macros", "rt-multi-thread", "io-util", "net", "sync"] }
futures-util = "0.3"
which = "6"
zip = "2"
pdf-extract = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
libc = "0.2"
keyring-core = "1"
arboard = "3"
open = "5"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation"] }
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["signal"] }
