[package]
name = "aiolm"
version = "0.3.3"
default-run = "aiolm"
description = "AioLM: Tauri desktop manager for local inference runtimes"
authors = ["aiolm contributors"]
edition = "2021"
rust-version = "1.98.0"

[features]
# Normal cargo test runs the process/streaming smoke fixture without extra flags.
# Distribution scripts disable defaults so the fixture cannot be packaged.
default = ["test-fixtures"]
test-fixtures = []
# Embedded WebDriver is opt-in and registered only in macOS debug builds.
macos-ui-smoke = ["dep:tauri-plugin-wdio-webdriver"]

[[bin]]
name = "fake-llama-server"
path = "src/bin/fake-llama-server.rs"
required-features = ["test-fixtures"]

[[test]]
name = "smoke_fake"
path = "tests/smoke_fake.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_adapters"
path = "tests/runtime_adapters.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_help_journey"
path = "tests/runtime_help_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_option_order_journey"
path = "tests/runtime_option_order_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_entrypoint_wizard"
path = "tests/runtime_entrypoint_wizard.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_bridge_journey"
path = "tests/runtime_bridge_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_bridge_help_streams"
path = "tests/runtime_bridge_help_streams.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_help_encoding_journey"
path = "tests/runtime_help_encoding_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_interpreter_command_journey"
path = "tests/runtime_interpreter_command_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_metadata_journey"
path = "tests/runtime_metadata_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_positional_metadata_journey"
path = "tests/runtime_positional_metadata_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_entry_ownership_journey"
path = "tests/runtime_entry_ownership_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_registration_bounds"
path = "tests/runtime_registration_bounds.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_adapter_setup"
path = "tests/runtime_adapter_setup.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_auto_connection"
path = "tests/runtime_auto_connection.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_command_journey"
path = "tests/runtime_command_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_context_journey"
path = "tests/runtime_context_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "runtime_fact_conflict_journey"
path = "tests/runtime_fact_conflict_journey.rs"
required-features = ["test-fixtures"]

[[test]]
name = "headless_descendant_listener"
path = "tests/headless_descendant_listener.rs"
required-features = ["test-fixtures"]

[lib]
name = "aiolm_lib"
# Both desktop executables consume the shared Rust library directly.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Already locked through reqwest; help decoding of explicit Windows code pages.
encoding_rs = "0.8.35"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "time", "macros", "rt-multi-thread", "io-util", "net", "sync", "signal"] }
futures-util = "0.3"
which = "6"
zip = "2"
flate2 = "1"
tar = "0.4"
pdf-extract = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
libc = "0.2"
keyring-core = "1"
arboard = "3"
open = "5"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
# Retain the Linux notification sender using the already locked async backend.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# Share the desktop plugins' async-io backend. Enabling zbus/tokio globally
# makes the notification plugin's blocking DBus call nest a Tokio runtime.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tokio = { version = "1", features = ["signal"] }

# Keep full executable/artifact verification responsive in development too.
# The version matches Cargo.lock; release already optimizes this dependency.
[profile.dev.package."sha2:0.10.9"]
opt-level = 3
